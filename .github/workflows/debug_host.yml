name: Debug Host
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "--- AGGRESSIVE NETWORK AUDIT ---"
            CUR_IP=$(curl -s ifconfig.me)
            echo "Observed Public IP: $CUR_IP"
            echo "--- interfaces ---"
            ip -4 addr show
            echo "--- iptables-save (Complete Ruleset) ---"
            sudo iptables-save
            echo "--- ss (Socket Statistics) ---"
            ss -tulpn
            echo "--- Test Reachability: Starting temporary python server on port 8081 ---"
            timeout 10s python3 -m http.server 8081 &
            sleep 2
            echo "Attempting to curl 8081 from host..."
            curl -v http://localhost:8081 || echo "local test failed"
            echo "--- Backend Health ---"
            docker exec stratum-sports-backend-1 curl -s http://localhost:8000/api/v1/health/live
            echo "--- Frontend to Backend Internal Curl ---"
            docker exec stratum-sports-frontend-1 curl -v http://backend:8000/api/v1/health/live
            echo "Backend logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 backend
            echo "Worker logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 worker
            echo "Frontend logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 frontend
            echo "UFW Status:"
            ufw status || echo "ufw not available"
            echo "Nginx Status:"
            systemctl status nginx || echo "nginx service not found"
            echo "Nginx Config Test:"
            nginx -t || echo "nginx binary not found"
            echo "Network listening ports:"
            ss -tulpn || netstat -tulpn || echo "network tools not found"
