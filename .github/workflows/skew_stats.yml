name: Skew Stats
on: workflow_dispatch
jobs:
  run_stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/stratum-sports
            # Write the stats script directly
            printf 'import asyncio\nfrom sqlalchemy import select, func\nfrom app.api.deps import get_db\n\nasync def main():\n    async for db in get_db():\n        from app.models.canonical_event_alignment import CanonicalEventAlignment\n        from app.models.exchange_quote_event import ExchangeQuoteEvent\n        from app.models.signal import Signal\n\n        alignments = (await db.execute(select(func.count(CanonicalEventAlignment.id)))).scalar()\n        quotes = (await db.execute(select(func.count(ExchangeQuoteEvent.id)))).scalar()\n        sigs = (await db.execute(select(func.count(Signal.id)))).scalar()\n        skew_sigs = (await db.execute(select(func.count(Signal.id)).where(Signal.kalshi_liquidity_skew.isnot(None)))).scalar()\n\n        print("====================================")\n        print("PRODUCTION DB SKEW DATA ACQUIRED")\n        print("====================================")\n        print(f"Canonical Alignments (Kalshi IDs): {alignments}")\n        print(f"Exchange Quote Events (Raw Data): {quotes}")\n        print(f"Total Signals Indexed: {sigs}")\n        print(f"Signals with Kalshi Liquidity Skew: {skew_sigs}")\n\n        if skew_sigs > 0:\n            min_skew, max_skew, avg_skew = (await db.execute(\n                select(\n                    func.min(Signal.kalshi_liquidity_skew),\n                    func.max(Signal.kalshi_liquidity_skew),\n                    func.avg(Signal.kalshi_liquidity_skew)\n                ).where(Signal.kalshi_liquidity_skew.isnot(None))\n            )).fetchone()\n            print(f"Metrics -> Min: {min_skew:.3f} | Max: {max_skew:.3f} | Avg: {avg_skew:.3f}")\n\n            res = await db.execute(select(Signal.metadata_json).where(Signal.kalshi_liquidity_skew.isnot(None)))\n            signals = res.scalars().all()\n            buckets = {}\n            for meta in signals:\n                if meta and "kalshi_gate" in meta:\n                    b = meta["kalshi_gate"].get("kalshi_skew_bucket", "Unknown")\n                    buckets[b] = buckets.get(b, 0) + 1\n            print(f"Bucket Distribution: {buckets}")\n\nif __name__ == "__main__":\n    asyncio.run(main())\n' > backend/scripts/get_skew_stats.py
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend python -m scripts.get_skew_stats
