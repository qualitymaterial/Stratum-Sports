name: debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/stratum-sports
            git checkout main && git pull
            mkdir -p agents/executive_brief
            cat << 'EOF' > setup_agent_prod.py
            import subprocess
            import os
            import re
            import secrets
            import string

            def run(cmd):
                result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
                if result.returncode != 0:
                    return f"FAILED: {result.stdout} {result.stderr}"
                return result.stdout.strip()

            print("A) Detecting compose config...")
            db_container = run("docker compose ps -q db") or run("docker compose ps -q postgres")
            db_service_name = "db" if " db" in run("docker compose ps --services") else "postgres"
            print(f"DB Container: {db_container}, Service Name: {db_service_name}")

            print("B) Detecting credentials...")
            env_vars = run(f"docker exec stratum-sports-db-1 printenv")
            admin_user = "postgres"
            db_name = "app"
            if env_vars:
                for line in env_vars.split('\n'):
                    if line.startswith('POSTGRES_USER='): admin_user = line.split('=')[1]
                    if line.startswith('POSTGRES_DB='): db_name = line.split('=')[1]
            print(f"Admin User: {admin_user}, DB: {db_name}")

            print("C) Creating read-only user...")
            alphabet = string.ascii_letters + string.digits
            password = ''.join(secrets.choice(alphabet) for i in range(24))
            sql = f"""
            DO $do$ 
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_user WHERE usename = 'stratum_agent_ro') THEN
                CREATE USER stratum_agent_ro WITH PASSWORD '{password}';
              END IF;
            END
            $do$;
            GRANT CONNECT ON DATABASE {db_name} TO stratum_agent_ro;
            GRANT USAGE ON SCHEMA public TO stratum_agent_ro;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO stratum_agent_ro;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO stratum_agent_ro;
            """
            sql_escaped = sql.replace('"', '\\"')
            run(f"docker exec stratum-sports-db-1 psql -U {admin_user} -d {db_name} -c \"{sql_escaped}\"")

            print("D) Updating .env...")
            env_path = "agents/executive_brief/.env"
            db_url = f"postgresql+psycopg://stratum_agent_ro:{password}@{db_service_name}:5432/{db_name}"
            
            openai_key = None
            # Search for OpenAI Key in root .env.production or current .env
            search_paths = [env_path, ".env.production", ".env"]
            for path in search_paths:
                if os.path.exists(path):
                    with open(path, 'r') as f:
                        for line in f:
                            if "OPENAI_API_KEY=" in line and not line.strip().startswith('#'):
                                openai_key = line.split('=')[1].strip()
                                break
                if openai_key: break
            
            current_content = ""
            if os.path.exists(env_path):
                with open(env_path, 'r') as f: current_content = f.read()

            if "DATABASE_URL=" in current_content:
                new_content = re.sub(r'DATABASE_URL=.*', f'DATABASE_URL={db_url}', current_content)
            else:
                new_content = current_content + f"\nDATABASE_URL={db_url}\n"
            
            if openai_key and "OPENAI_API_KEY=" not in new_content:
                new_content += f"OPENAI_API_KEY={openai_key}\n"
            
            with open(env_path, 'w') as f: f.write(new_content)
            
            print("Verifying .env keys...")
            with open(env_path, 'r') as f:
                for line in f:
                    if '=' in line and not line.strip().startswith('#'):
                        print(f"Key Found: {line.split('=')[0]}")

            print("E) Running agent once...")
            env_list = []
            with open(env_path, 'r') as f:
                for line in f:
                    line = line.strip()
                    if '=' in line and not line.startswith('#'):
                        # Using shlex.quote or similar might be safer, but flags should be simple here
                        env_list.append(f"-e {line}")
            env_flags = " ".join(env_list)

            agent_cmd = f"docker compose run --rm {env_flags} -v /opt/stratum-sports:/repo -w /repo backend sh -c 'pip install -r agents/executive_brief/requirements.txt --quiet && python3 agents/executive_brief/main.py'"
            print(f"Executing agent: {agent_cmd}")
            agent_result = subprocess.run(agent_cmd, shell=True, capture_output=True, text=True)
            agent_output = agent_result.stdout + "\n" + agent_result.stderr
            
            print("F) Results:")
            print(f"DB service hostname: {db_service_name}")
            print(f"DB name: {db_name}")
            success = "SUCCESS" if "Brief saved to" in agent_output else "FAILED"
            print(f"Agent run: {success}")
            if success == "FAILED":
                print(f"Reason: {agent_output}")
            
            print("\nFinal Cron Entry:")
            # Use absolute path for .env in cron
            print(f"0 8 * * * cd /opt/stratum-sports && docker compose --env-file /opt/stratum-sports/agents/executive_brief/.env run --rm -v /opt/stratum-sports:/repo -w /repo backend sh -c 'pip install -r agents/executive_brief/requirements.txt --quiet && python3 agents/executive_brief/main.py' >> /opt/stratum-sports/agents/executive_brief/agent.log 2>&1")

            EOF
            python3 setup_agent_prod.py
