name: fix_agent_schedules
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Update crontab and verify webhooks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "--- UPDATING CRONTAB ---"
            # 1. Clear old crontab or specific lines
            # 2. Add new schedules (13:00 UTC = 8:00 AM EST)
            cat << 'EOF' > /tmp/new_crontab
            # Executive Brief - 8:00 AM EST
            0 13 * * * cd /opt/stratum-sports && docker compose --env-file /opt/stratum-sports/agents/executive_brief/.env run --rm -v /opt/stratum-sports:/repo -w /repo backend sh -c 'pip install -r agents/executive_brief/requirements.txt --quiet && python3 agents/executive_brief/main.py' >> /opt/stratum-sports/agents/executive_brief/agent.log 2>&1
            
            # Signal Quality Auditor - 8:05 AM EST
            5 13 * * * cd /opt/stratum-sports && docker compose --env-file /opt/stratum-sports/agents/executive_brief/.env run --rm -v /opt/stratum-sports:/repo -w /repo backend sh -c 'mkdir -p agents/signal_quality_auditor/out && chmod -R 777 agents/signal_quality_auditor/out && cp agents/executive_brief/.env agents/signal_quality_auditor/.env && pip install -r agents/signal_quality_auditor/requirements.txt --quiet && python3 agents/signal_quality_auditor/main.py' >> /opt/stratum-sports/agents/signal_quality_auditor/agent.log 2>&1
            EOF
            crontab /tmp/new_crontab
            echo "Crontab updated."
            crontab -l
            
            echo "--- VERIFYING WEBHOOKS ---"
            grep "DISCORD_WEBHOOK_URL" /opt/stratum-sports/agents/executive_brief/.env || echo "No webhook found in executive_brief/.env"
