name: Debug Host
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "--- AGGRESSIVE NETWORK AUDIT V2 ---"
            TRUE_IP=$(curl -s ifconfig.me)
            echo "Public IP (base64): $(echo $TRUE_IP | base64)"
            echo "Internal IP Listing (eth0):"
            ip addr show eth0
            echo "--- Check for 3000 mapping ---"
            docker compose -f docker-compose.prod.yml ps
            echo "--- Local Curl to 80 ---"
            curl -I http://localhost:80
            echo "Backend logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 backend
            echo "Worker logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 worker
            echo "Frontend logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 frontend
            echo "UFW Status:"
            ufw status || echo "ufw not available"
            echo "Nginx Status:"
            systemctl status nginx || echo "nginx service not found"
            echo "Nginx Config Test:"
            nginx -t || echo "nginx binary not found"
            echo "Network listening ports:"
            ss -tulpn || netstat -tulpn || echo "network tools not found"
