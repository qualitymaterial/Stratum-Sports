name: Debug Host
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "Droplet IP is $(curl -s ifconfig.me)"
            echo "Docker ps:"
            docker ps
            echo "curl frontend locally:"
            curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo "failed"
            echo "Frontend logs:"
            docker logs stratum-sports-frontend-1 --tail 50
