name: debug_cron
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cron and agent logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "--- SERVER DATA ---"
            date
            timedatectl
            echo "--- CRONTAB ---"
            crontab -l
            echo "--- AGENT LOG (EXECUTIVE BRIEF) ---"
            tail -n 20 /opt/stratum-sports/agents/executive_brief/agent.log || echo "Log not found"
            echo "--- DOCKER PS ---"
            docker ps -a | grep -E "executive|auditor" || echo "No agent containers found"
            echo "--- CRON LOG (SYSTEM) ---"
            grep CRON /var/log/syslog | tail -n 20 || echo "Syslog access denied or not found"
