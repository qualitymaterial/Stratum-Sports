name: test_signal_auditor
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and run auditor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/stratum-sports
            git pull
            mkdir -p agents/signal_quality_auditor/out
            chmod -R 777 agents/signal_quality_auditor/out
            # Use the existing executive brief .env for shared credentials
            docker compose --env-file /opt/stratum-sports/agents/executive_brief/.env run --rm -v /opt/stratum-sports:/repo -w /repo backend sh -c 'env | grep -E "DATABASE_URL|OPENAI_API_KEY" && pip install -r agents/signal_quality_auditor/requirements.txt --quiet && python3 agents/signal_quality_auditor/main.py'
            echo "--- AUDIT REPORT ---"
            cat /opt/stratum-sports/agents/signal_quality_auditor/out/quality_report_$(date +%Y-%m-%d).json
