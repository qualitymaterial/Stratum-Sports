name: debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/stratum-sports
            cat << 'EOF' > setup_agent_prod.py
            import subprocess
            import os
            import re
            import secrets
            import string

            def run(cmd):
                result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
                if result.returncode != 0:
                    print(f"FAILED: {cmd}\nSTDOUT: {result.stdout}\nSTDERR: {result.stderr}")
                    return None
                return result.stdout.strip()

            print("A) Detecting compose config...")
            config_files = run("docker inspect stratum-sports-backend-1 --format '{{ index .Config.Labels \"com.docker.compose.project.config_files\" }}'")
            working_dir = run("docker inspect stratum-sports-backend-1 --format '{{ index .Config.Labels \"com.docker.compose.project.working_dir\" }}'")
            ps_output = run("docker compose ps")
            
            db_service = None
            if ps_output:
                for line in ps_output.split('\n'):
                    if 'db' in line.lower() or 'postgres' in line.lower():
                        db_service = line.split()[0]
                        # Trim project prefix if present, but since it's the hostname in the network, we need the service name
                        # Actually docker compose ps shows the *container* name.
            
            # Re-detecting service name more accurately
            db_container = run("docker compose ps -q db") or run("docker compose ps -q postgres")
            if not db_container:
                print("Could not find db service name via ps.")
                db_service_name = "db" # Default guess
            else:
                db_service_name = "db" if run("docker compose ps --services | grep ^db$") else "postgres"

            print(f"DB Container: {db_container}, Service Name Guess: {db_service_name}")

            print("B) Detecting credentials...")
            env_vars = run(f"docker exec stratum-sports-db-1 printenv")
            admin_user = "postgres"
            db_name = "app"
            if env_vars:
                for line in env_vars.split('\n'):
                    if line.startswith('POSTGRES_USER='): admin_user = line.split('=')[1]
                    if line.startswith('POSTGRES_DB='): db_name = line.split('=')[1]
            
            print(f"Admin User: {admin_user}, DB: {db_name}")

            print("C) Creating read-only user...")
            alphabet = string.ascii_letters + string.digits
            password = ''.join(secrets.choice(alphabet) for i in range(24))
            
            sql = f"""
            DO $$ 
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_user WHERE usename = 'stratum_agent_ro') THEN
                CREATE USER stratum_agent_ro WITH PASSWORD '{password}';
              END IF;
            END
            $$;
            GRANT CONNECT ON DATABASE {db_name} TO stratum_agent_ro;
            GRANT USAGE ON SCHEMA public TO stratum_agent_ro;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO stratum_agent_ro;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO stratum_agent_ro;
            """
            
            run(f"docker exec stratum-sports-db-1 psql -U {admin_user} -d {db_name} -c \"{sql}\"")

            print("D) Updating .env...")
            env_path = "agents/executive_brief/.env"
            db_url = f"postgresql+psycopg://stratum_agent_ro:{password}@{db_service_name}:5432/{db_name}"
            
            if os.path.exists(env_path):
                content = open(env_path).read()
                if "DATABASE_URL=" in content:
                    content = re.sub(r'DATABASE_URL=.*', f'DATABASE_URL={db_url}', content)
                else:
                    content += f"\nDATABASE_URL={db_url}\n"
                with open(env_path, 'w') as f: f.write(content)
            else:
                with open(env_path, 'w') as f:
                    f.write(f"DATABASE_URL={db_url}\n")
            
            print("E) Running agent once...")
            # Using run with bind mount as backend might not have the code if not pulled yet
            agent_output = run("docker compose run --rm -v /opt/stratum-sports:/repo -w /repo backend python3 agents/executive_brief/main.py")
            
            print("F) Results:")
            print(f"DB service hostname: {db_service_name}")
            print(f"DB name: {db_name}")
            
            success = "SUCCESS" if agent_output and "Brief saved to" in agent_output else "FAILED"
            print(f"Agent run: {success}")
            if success == "FAILED":
                print(f"Reason: {agent_output}")
            
            print("\nFinal Cron Entry:")
            print(f"0 8 * * * cd /opt/stratum-sports && docker compose run --rm -v /opt/stratum-sports:/repo -w /repo backend python3 agents/executive_brief/main.py >> agents/executive_brief/agent.log 2>&1")

            EOF
            python3 setup_agent_prod.py
