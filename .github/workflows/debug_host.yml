name: Debug Host
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/stratum-sports
            echo "Current Directory Files:"
            ls -al
            echo "Production Env (sanitized):"
            grep -E "APP_|URL|PORT|HOST|ORIGIN" .env.production || echo "env file issues"
            echo "Health Check manually from host using docker exec:"
            docker exec stratum-sports-backend-1 curl -v http://localhost:8000/api/v1/health/live || echo "failed"
            echo "Backend logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 backend
            echo "Worker logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 worker
            echo "Frontend logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 frontend
            echo "UFW Status:"
            ufw status || echo "ufw not available"
            echo "Nginx Status:"
            systemctl status nginx || echo "nginx service not found"
            echo "Nginx Config Test:"
            nginx -t || echo "nginx binary not found"
            echo "Network listening ports:"
            ss -tulpn || netstat -tulpn || echo "network tools not found"
