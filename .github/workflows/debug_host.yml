name: Debug Host
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            CUR_IP=$(curl -s ifconfig.me)
            echo "Host IP: $CUR_IP"
            echo "UFW Status:"
            sudo ufw status verbose || echo "ufw not available"
            echo "IPTables Filter Table:"
            sudo iptables -L -n -v | head -n 50
            echo "Health Check inside BACKEND container:"
            docker exec stratum-sports-backend-1 curl -v http://localhost:8000/api/v1/health/live || echo "backend failed"
            echo "Health Check inside FRONTEND container (proxy check):"
            docker exec stratum-sports-frontend-1 curl -v http://localhost:3000/api/v1/health/live || echo "frontend proxy fail"
            echo "Health Check FROM HOST to Front-end (Port 80):"
            curl -v http://localhost:80 || echo "host-to-frontend fail"
            echo "Backend logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 backend
            echo "Worker logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 worker
            echo "Frontend logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 frontend
            echo "UFW Status:"
            ufw status || echo "ufw not available"
            echo "Nginx Status:"
            systemctl status nginx || echo "nginx service not found"
            echo "Nginx Config Test:"
            nginx -t || echo "nginx binary not found"
            echo "Network listening ports:"
            ss -tulpn || netstat -tulpn || echo "network tools not found"
