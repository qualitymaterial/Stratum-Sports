name: Repair Droplet
on: workflow_dispatch
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "===================================="
            echo "PRODUCTION DB SKEW DATA ACQUIRED"
            echo "===================================="
            cd /opt/stratum-sports
            
            echo "1. Kalshi Mappings (Canonical Alignments)"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T db psql -U stratum_prod -d stratum_sports -c "SELECT source, count(*) FROM canonical_event_alignments GROUP BY source;"
            
            echo "2. Raw Exchange Quotes (Kalshi ticks)"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T db psql -U stratum_prod -d stratum_sports -c "SELECT source, count(*) FROM exchange_quote_events GROUP BY source;"
            
            echo "3. Total Signals with Kalshi Liquidity Skew"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T db psql -U stratum_prod -d stratum_sports -c "SELECT count(*) FROM signals WHERE kalshi_liquidity_skew IS NOT NULL;"
            
            echo "4. Skew Distribution (Min, Max, Avg)"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T db psql -U stratum_prod -d stratum_sports -c "SELECT MIN(kalshi_liquidity_skew) as min_skew, MAX(kalshi_liquidity_skew) as max_skew, AVG(kalshi_liquidity_skew) as avg_skew FROM signals WHERE kalshi_liquidity_skew IS NOT NULL;"
