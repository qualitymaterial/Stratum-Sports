name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Optional commit SHA to deploy (defaults to the selected branch HEAD)."
        required: false
        type: string
      skip_ci_wait:
        description: "Skip waiting for CI success (use only for urgent deploys)."
        required: false
        default: false
        type: boolean
      auto_rollback_on_failure:
        description: "If enabled, automatically roll back to previous images when post-deploy smoke checks fail."
        required: false
        default: false
        type: boolean
      smoke_app_base_url:
        description: "External app URL used for post-deploy smoke checks."
        required: false
        default: "http://104.236.237.83"
        type: string
      smoke_api_base_url:
        description: "External API URL used for post-deploy smoke checks."
        required: false
        default: "http://104.236.237.83"
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: qualitymaterial

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_sha: ${{ steps.prepare.outputs.deploy_sha }}
      skip_ci_wait: ${{ steps.prepare.outputs.skip_ci_wait }}
      skip_ci_wait_reason: ${{ steps.prepare.outputs.skip_ci_wait_reason }}
    steps:
      - name: Resolve deploy SHA
        id: prepare
        run: |
          set -eu
          REF_NAME="${{ github.ref_name }}"
          SHA_INPUT="${{ inputs.deploy_sha }}"
          if [ -n "$SHA_INPUT" ]; then
            echo "deploy_sha=$SHA_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.skip_ci_wait }}" = "true" ]; then
            echo "skip_ci_wait=true" >> "$GITHUB_OUTPUT"
            echo "skip_ci_wait_reason=manual_override" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" != "main" ]; then
            echo "skip_ci_wait=true" >> "$GITHUB_OUTPUT"
            echo "skip_ci_wait_reason=non_main_ref:$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "skip_ci_wait=false" >> "$GITHUB_OUTPUT"
            echo "skip_ci_wait_reason=main_ref_requires_ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout for SHA validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deploy SHA exists on remote and is branch-reachable
        env:
          DEPLOY_SHA: ${{ steps.prepare.outputs.deploy_sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          set -eu
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune

          if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: deploy SHA ${DEPLOY_SHA} does not exist on origin."
            echo "Hint: push the commit first, or leave deploy_sha empty to use the selected branch HEAD."
            exit 1
          fi

          containing_refs="$(git branch -r --contains "$DEPLOY_SHA" | sed '/^[[:space:]]*$/d')"
          if [ -z "$containing_refs" ]; then
            echo "ERROR: deploy SHA ${DEPLOY_SHA} is not reachable from any remote branch."
            echo "This usually means the SHA was force-pushed away or never pushed."
            exit 1
          fi

          echo "Validated deploy SHA ${DEPLOY_SHA}. Reachable from:"
          echo "$containing_refs"

          if git show-ref --verify --quiet "refs/remotes/origin/${DEPLOY_REF}"; then
            if ! git merge-base --is-ancestor "$DEPLOY_SHA" "origin/${DEPLOY_REF}"; then
              echo "WARNING: deploy SHA ${DEPLOY_SHA} is not on origin/${DEPLOY_REF} history."
              echo "Deployment will still continue because the SHA is reachable on origin."
            fi
          fi

  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare
    steps:
      - name: Verify CI passed for this commit
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = "${{ needs.prepare.outputs.deploy_sha }}";
            const skipCiWait = "${{ needs.prepare.outputs.skip_ci_wait }}" === "true";
            const skipCiWaitReason = "${{ needs.prepare.outputs.skip_ci_wait_reason }}";
            if (skipCiWait) {
              core.warning(`Skipping CI verification for ${headSha}. Reason: ${skipCiWaitReason}`);
              return;
            }
            const maxAttempts = 60; // 10 minutes at 10s cadence
            const sleepMs = 10_000;

            let latest = null;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const result = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci.yml",
                head_sha: headSha,
                per_page: 20,
              });

              const runs = result.data.workflow_runs
                .filter((run) => run.head_sha === headSha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (runs.length === 0) {
                core.info(`Attempt ${attempt}/${maxAttempts}: waiting for CI run to appear for ${headSha}...`);
              } else {
                latest = runs[0];
                core.info(
                  `Attempt ${attempt}/${maxAttempts}: CI status=${latest.status}, conclusion=${latest.conclusion ?? "pending"} (${latest.html_url})`
                );

                if (latest.status === "completed") {
                  if (latest.conclusion === "success") {
                    core.info(`CI verified: ${latest.html_url}`);
                    return;
                  }
                  core.setFailed(`CI run failed for commit ${headSha}: ${latest.html_url}`);
                  return;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }

            if (latest) {
              core.setFailed(
                `Timed out waiting for completed CI run for commit ${headSha}. Latest run: ${latest.html_url}`
              );
            } else {
              core.setFailed(`Timed out waiting for CI run to appear for commit ${headSha}.`);
            }

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [prepare, verify-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.deploy_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha,scope=deploy-backend
          cache-to: type=gha,mode=max,scope=deploy-backend
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/stratum-sports-backend:${{ needs.prepare.outputs.deploy_sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=deploy-frontend
          cache-to: type=gha,mode=max,scope=deploy-frontend
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/stratum-sports-frontend:${{ needs.prepare.outputs.deploy_sha }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare, build-images]
    steps:
      - name: Validate deploy secrets
        run: |
          set -eu
          [ -n "${{ secrets.DROPLET_HOST }}" ] || { echo "ERROR: DROPLET_HOST is empty"; exit 1; }
          [ -n "${{ secrets.DROPLET_USER }}" ] || { echo "ERROR: DROPLET_USER is empty"; exit 1; }
          [ -n "${{ secrets.DROPLET_SSH_KEY }}" ] || { echo "ERROR: DROPLET_SSH_KEY is empty"; exit 1; }
          [ -n "${{ secrets.GHCR_USERNAME }}" ] || { echo "ERROR: GHCR_USERNAME is empty"; exit 1; }
          [ -n "${{ secrets.GHCR_TOKEN }}" ] || { echo "ERROR: GHCR_TOKEN is empty"; exit 1; }

      - name: SSH into droplet and deploy pulled images
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.deploy_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          AUTO_ROLLBACK_ON_FAILURE: ${{ inputs.auto_rollback_on_failure }}
          SMOKE_APP_BASE_URL: ${{ inputs.smoke_app_base_url }}
          SMOKE_API_BASE_URL: ${{ inputs.smoke_api_base_url }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,AUTO_ROLLBACK_ON_FAILURE,SMOKE_APP_BASE_URL,SMOKE_API_BASE_URL
          script: |
            set -eu
            cd /opt/stratum-sports
            test -f docker-compose.prod.yml
            test -f .env.production

            git config --global --add safe.directory /opt/stratum-sports || true

            # Abort on tracked-file modifications (uncommitted changes that could conflict)
            tracked_changes="$(git diff --name-only HEAD 2>/dev/null || true)$(git diff --cached --name-only HEAD 2>/dev/null || true)"
            if [ -n "$tracked_changes" ]; then
              echo "ERROR: uncommitted changes to tracked files in /opt/stratum-sports; aborting."
              git status --short || true
              exit 1
            fi

            # Clean up untracked files (scratch scripts, __pycache__, etc.) so they don't block pulls
            untracked="$(git ls-files --others --exclude-standard 2>/dev/null || true)"
            if [ -n "$untracked" ]; then
              echo "WARNING: removing untracked files from deploy target:"
              echo "$untracked"
              git clean -fd
            fi

            # Network Check/Debug: Sometimes droplets experience transient DNS failures during heavy deployment.
            echo "--- Checking network / DNS ---"
            ping -c 2 github.com || { echo "WARNING: ping to github.com failed. Checking resolvectl and resolv.conf:"; resolvectl status || true; cat /etc/resolv.conf || true; }
            
            # Temporary GitHub DNS Resilience: If git fetch fails because of DNS, retry up to 5 times.
            for attempt in {1..5}; do
              if git fetch origin main; then
                break
              fi
              echo "WARNING: git fetch failed on attempt $attempt. Retrying in 10s..."
              sleep 10
              if [ "$attempt" -eq 5 ]; then
                echo "ERROR: git fetch failed after 5 attempts."
                exit 1
              fi
            done
            
            git checkout main
            
            for attempt in {1..5}; do
              if git pull --ff-only origin main; then
                break
              fi
              echo "WARNING: git pull failed on attempt $attempt. Retrying in 10s..."
              sleep 10
              if [ "$attempt" -eq 5 ]; then
                echo "ERROR: git pull failed after 5 attempts."
                exit 1
              fi
            done

            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            elif command -v docker-compose >/dev/null 2>&1; then
              compose() { docker-compose "$@"; }
            else
              echo "ERROR: docker compose plugin (or docker-compose) not found on droplet."
              exit 1
            fi
            diagnose() {
              compose -f docker-compose.prod.yml --env-file .env.production ps || true
              compose -f docker-compose.prod.yml --env-file .env.production logs --tail=200 backend worker frontend db redis || true
            }
            upsert_env_var() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env.production; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env.production
              else
                printf '%s=%s\n' "$key" "$value" >> .env.production
              fi
            }
            persist_image_env() {
              upsert_env_var BACKEND_IMAGE "$BACKEND_IMAGE"
              upsert_env_var WORKER_IMAGE "$WORKER_IMAGE"
              upsert_env_var FRONTEND_IMAGE "$FRONTEND_IMAGE"
            }
            get_running_image() {
              service="$1"
              cid="$(compose -f docker-compose.prod.yml --env-file .env.production ps -q "$service" 2>/dev/null || true)"
              if [ -z "$cid" ]; then
                return 0
              fi
              docker inspect -f '{{.Config.Image}}' "$cid" 2>/dev/null || true
            }
            rollback() {
              if [ "${AUTO_ROLLBACK_ON_FAILURE}" != "true" ]; then
                echo "INFO: auto rollback disabled; skipping rollback."
                return 1
              fi
              if [ -z "${PREV_BACKEND_IMAGE:-}" ] || [ -z "${PREV_WORKER_IMAGE:-}" ] || [ -z "${PREV_FRONTEND_IMAGE:-}" ]; then
                echo "ERROR: previous image refs unavailable; cannot rollback automatically."
                return 1
              fi

              echo "Attempting rollback to previous image set..."
              BACKEND_IMAGE="$PREV_BACKEND_IMAGE"
              WORKER_IMAGE="$PREV_WORKER_IMAGE"
              FRONTEND_IMAGE="$PREV_FRONTEND_IMAGE"
              export BACKEND_IMAGE WORKER_IMAGE FRONTEND_IMAGE
              persist_image_env

              if ! compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build --remove-orphans; then
                echo "ERROR: rollback compose up failed"
                diagnose
                return 1
              fi
              if ! compose -f docker-compose.prod.yml --env-file .env.production exec -T backend curl -fsS http://localhost:8000/api/v1/health/live >/dev/null; then
                echo "ERROR: rollback backend health check failed"
                diagnose
                return 1
              fi
              echo "Rollback completed."
              return 0
            }
            smoke_checks() {
              app_base="${SMOKE_APP_BASE_URL%/}"
              api_base="${SMOKE_API_BASE_URL%/}"

              # Internal health probes (container-local) are authoritative for rollback gating.
              health_ok=0
              for attempt in $(seq 1 20); do
                if compose -f docker-compose.prod.yml --env-file .env.production exec -T backend curl -fsS http://localhost:8000/api/v1/health/live >/dev/null \
                  && compose -f docker-compose.prod.yml --env-file .env.production exec -T backend curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null \
                  && curl -fsS --max-time 10 http://localhost/ >/dev/null; then
                  health_ok=1
                  break
                fi
                sleep 3
              done
              if [ "$health_ok" -ne 1 ]; then
                echo "ERROR: internal post-deploy smoke checks failed"
                return 1
              fi

              # External probes enforce canonical host health.
              curl -fsS --max-time 12 "$app_base/" >/dev/null
              curl -fsS --max-time 12 "$api_base/api/v1/health/live" >/dev/null
              curl -fsS --max-time 12 "$api_base/api/v1/health/ready" >/dev/null
            }

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            PREV_BACKEND_IMAGE="$(get_running_image backend)"
            PREV_WORKER_IMAGE="$(get_running_image worker)"
            PREV_FRONTEND_IMAGE="$(get_running_image frontend)"
            BACKEND_IMAGE="ghcr.io/qualitymaterial/stratum-sports-backend:${IMAGE_TAG}"
            WORKER_IMAGE="$BACKEND_IMAGE"
            FRONTEND_IMAGE="ghcr.io/qualitymaterial/stratum-sports-frontend:${IMAGE_TAG}"
            export BACKEND_IMAGE WORKER_IMAGE FRONTEND_IMAGE
            persist_image_env
            for ref in "$BACKEND_IMAGE" "$WORKER_IMAGE" "$FRONTEND_IMAGE"; do
              case "$ref" in
                *:latest)
                  echo "ERROR: mutable :latest tag detected in deploy image ref: $ref"
                  exit 1
                  ;;
                *:"$IMAGE_TAG")
                  ;;
                *)
                  echo "ERROR: image ref does not match deploy SHA $IMAGE_TAG: $ref"
                  exit 1
                  ;;
              esac
            done

            if ! compose -f docker-compose.prod.yml --env-file .env.production pull backend worker frontend; then
              echo "ERROR: image pull failed"
              diagnose
              exit 1
            fi
            if ! compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build --remove-orphans; then
              echo "ERROR: compose up failed"
              diagnose
              rollback || true
              exit 1
            fi

            if ! smoke_checks; then
              echo "ERROR: post-deploy smoke checks failed"
              diagnose
              rollback || true
              exit 1
            fi
            compose -f docker-compose.prod.yml --env-file .env.production ps
